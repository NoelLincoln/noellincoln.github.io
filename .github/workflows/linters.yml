name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend-lint:
    name: Backend — Ruff
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
        working-directory: backend
      - name: Format check
        run: ruff format --check .
        working-directory: backend

  backend-test:
    name: Backend — Pytest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run tests
        run: pytest
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DATABASE_URL: sqlite:///tmp/test.db

  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=frontend
      - name: Format check
        run: npm run format:check --workspace=frontend

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=frontend
